name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Update Site Data
      - Send Test Email Alert
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.site.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.site.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-next/package-lock.json

      - name: Install React app dependencies
        run: npm ci --no-audit --no-fund
        working-directory: react-next

      - name: Validate service configs
        run: python3 scripts/validate_services.py

      - name: Build React root + preview artifacts
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.ALERT_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: python3 scripts/build_react_artifacts.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: react-next

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify React preview artifact paths
        run: python3 scripts/verify_next_preview_artifact.py

      - name: Run mobile route smoke screenshots
        run: npm run qa:mobile-smoke
        working-directory: react-next

      - name: Validate public artifact exposure rules
        run: python3 scripts/check_public_exposure.py

      - name: Upload mobile smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-screenshots
          path: output/playwright/
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
